<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>See U - 回见</title>
  <meta name="description" content="回见。" />

  <meta property="og:title" content="See U - 回见" />
  <meta property="og:description" content="Genius of Life，做生活中的天才。" />
  <meta property="og:image" content="see-u-avatar.png" />
  <meta property="og:url" content="https://jayliang0721.github.io/seeu/" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafafa;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1.5rem;
    }
    .container {
      max-width: 640px;
    }
    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1.2rem;
      border: 2px solid #ddd;
      box-shadow: 0 10px 30px rgba(17, 17, 17, 0.08);
    }
    .logo {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    .logo span {
      display: inline-block;
      transform: scale(1) rotate(0deg);
      transition: transform 0.2s ease;
    }
    .logo span:hover {
      transform: scale(1.1) rotate(-5deg);
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 1.2rem;
      line-height: 1.6;
      color: #555;
      margin-bottom: 2rem;
    }
    .tag {
      display: inline-block;
      background: #e8e8e8;
      padding: 0.4rem 1rem;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #333;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .tag:hover {
      background: #d5d5d5;
    }
    @media (max-width: 480px) {
      h1 { font-size: 2rem; }
      p { font-size: 1rem; }
      .logo { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <main class="container">
    <img src="see-u-avatar.png" alt="See U 回见" class="avatar" />

    <div class="logo">
      <span>S</span><span>e</span><span>e</span> <span>U</span> <span>回</span><span>见</span>
    </div>

    <p>
      Genius of Life<br />
      做生活中的天才
    </p>

    <a href="https://www.baidu.com" target="_blank" rel="noopener noreferrer" class="tag">即将推出</a>
  </main>
</body>
</html>
